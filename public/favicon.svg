<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051329" />
      <stop offset="100%" stop-color="#0a2a4a" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Liquid Gradient -->
    <linearGradient id="liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Flask Glass Shine -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Icon Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#borderGlow)" stroke-width="2.5" />

  <!-- Background Atom Orbit Loop -->
  <ellipse cx="32" cy="35" rx="23" ry="9" transform="rotate(-25 32 35)" stroke="#0ea5e9" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.45" />

  <!-- Flask Liquid fill (bottom interior) -->
  <path d="M 23 37 L 16.5 49 C 15.5 50.8 16.8 53 18.8 53 L 45.2 53 C 47.2 53 48.5 50.8 47.5 49 L 41 37 Z" fill="url(#liquid)" />

  <!-- Liquid Surface / Meniscus Highlight -->
  <ellipse cx="32" cy="37" rx="9" ry="2" fill="#67e8f9" opacity="0.9" />

  <!-- Flask Outer Outline (Laboratory Beaker) -->
  <path d="M 27 13 L 37 13 M 28 13 L 28 25 L 15.2 48.2 C 13.6 51 15.6 54.5 18.8 54.5 L 45.2 54.5 C 48.4 54.5 50.4 51 48.8 48.2 L 36 25 L 36 13" 
        stroke="#e2e8f0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Flask Neck Lip -->
  <line x1="26" y1="13" x2="38" y2="13" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

  <!-- Glass Light Reflection Streak -->
  <path d="M 21 47 L 30 30" stroke="url(#glassShine)" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />

  <!-- Bubbles rising in liquid -->
  <circle cx="28" cy="45" r="2" fill="#ffffff" opacity="0.9" filter="url(#glow)" />
  <circle cx="36" cy="43" r="1.5" fill="#cffafe" opacity="0.8" />
  <circle cx="31" cy="40" r="2.2" fill="#ffffff" opacity="0.85" />
  <circle cx="33" cy="27" r="1.3" fill="#38bdf8" opacity="0.9" />
  <circle cx="30" cy="20" r="1" fill="#67e8f9" opacity="0.85" />

  <!-- Sparkle Star at top right of the flask -->
  <path d="M 47 16 Q 47 20 51 20 Q 47 20 47 24 Q 47 20 43 20 Q 47 20 47 16 Z" fill="#38bdf8" filter="url(#glow)" />
</svg>
